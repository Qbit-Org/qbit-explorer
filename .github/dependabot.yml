version: 2
# Dependabot reads this file only from the default branch, main, so a change
# here takes effect once a release brings it to main.
#
# Version updates read the manifests on 1.x.x, the integration branch, and open
# their pull requests against it, so they get the same checks as any other
# change and reach main with the next release. Security updates always open
# against main. With target-branch set, the options below don't apply to them:
# a security update can cover a dev dependency, and can propose a major
# version.
updates:
  # npm: patch releases (where security fixes such as Angular's usually ship)
  # arrive grouped in one pull request per directory. Minor releases still get
  # a pull request each, and major releases are not proposed. Only production
  # dependencies get version updates, plus Angular's dev packages.
  - package-ecosystem: npm
    target-branch: "1.x.x"
    versioning-strategy: increase
    directory: "/backend"
    groups:
      backend-patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    allow:
      - dependency-type: "production"

  - package-ecosystem: npm
    target-branch: "1.x.x"
    directory: "/frontend"
    versioning-strategy: increase
    # A dependency joins the first group that matches it, so Angular patch
    # releases stay in the Angular group with its minor releases, and
    # frontend-patch-updates takes every other patch release.
    groups:
      frontend-angular-dependencies:
        patterns:
          - "@angular*"
          - "@ng-*"
          - "ngx-*"
      frontend-jest-dependencies:
        patterns:
          - "@types/jest"
          - "jest"
      frontend-eslint-dependencies:
        patterns:
          - "@typescript-eslint*"
          - "eslint"
      frontend-patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    allow:
      - dependency-type: "production"
      # @angular/compiler-cli has to move with @angular/compiler
      - dependency-name: "@angular*"

  # cargo: patch releases arrive grouped, as for npm, and minor releases get a
  # pull request each. lockfile-only keeps every update within Cargo.toml's
  # caret requirements, so no major release is proposed, and no 0.x crate moves
  # to its next, breaking, 0.y release; that needs no ignore rule. Dependabot
  # runs cargo with the toolchain in rust/gbt/rust-toolchain, which it can read
  # only in TOML form. An update that needs a newer Rust fails the Rust GBT job
  # in ci.yml.
  - package-ecosystem: cargo
    target-branch: "1.x.x"
    directory: "/rust/gbt"
    versioning-strategy: lockfile-only
    groups:
      rust-gbt-patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # rust is this Dockerfile's only base image. Its Rust stays in step with
  # rust/gbt/rust-toolchain, so minor versions move by hand, and Dependabot
  # proposes only patch releases.
  - package-ecosystem: docker
    target-branch: "1.x.x"
    directory: "/docker/backend"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "rust"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  # node (the build stage) gets minor releases. nginx gets patch releases,
  # which carry its stable branch's security fixes. Its odd minor versions are
  # the mainline branch and the even ones are stable, which Dependabot can't
  # tell apart, so nginx moves to the next stable minor by hand.
  - package-ecosystem: docker
    target-branch: "1.x.x"
    directory: "/docker/frontend"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "node"
        update-types:
          ["version-update:semver-major", "version-update:semver-patch"]
      - dependency-name: "nginx"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    target-branch: "1.x.x"
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types:
          ["version-update:semver-major", "version-update:semver-patch"]
      # Pinned to the commit upstream mempool/mempool uses; update by hand.
      - dependency-name: "dtolnay/rust-toolchain"

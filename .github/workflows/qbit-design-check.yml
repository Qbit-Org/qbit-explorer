name: Qbit Design Contract

on:
  pull_request:
    types: [opened, review_requested, synchronize]
  push:
    branches:
      - main
      - develop-qbit

# Read-only token; the check only fetches the public qbit.org contract.
permissions:
  contents: read

jobs:
  design-drift-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    name: Vendored qbit.org design contract drift check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26.12.1"

      - name: Check vendored design contract against qbit.org
        run: node frontend/scripts/sync-qbit-design.mjs --check

name: Docker build on tag
env:
  DOCKER_CLI_EXPERIMENTAL: enabled
  TAG_FMT: "^refs/tags/(((.?[0-9]+){3,4}))$"
  DOCKER_BUILDKIT: 1  # Enable BuildKit for better performance
  COMPOSE_DOCKER_CLI_BUILD: 0

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-*
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  test-images:
    # Always run on tag pushes and all pull requests
    # A newer event (push or label) on the same pull request cancels this
    # job's older run. The concurrency is job-level so that build and
    # tag-latest are never cancelled while they push images, and each tag push
    # gets its own group.
    concurrency:
      group: docker-test-images-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    name: Test built Docker images
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          # keep the pull request merge ref: this workflow doesn't run on pushes
          # to main, so test the pull request merged with its base, not the
          # head alone
          persist-credentials: false

      - name: Add SHORT_SHA env property with commit short sha
        # the commit this job builds: the merge ref on pull requests
        run: echo "SHORT_SHA=${GITHUB_SHA:0:8}" >> $GITHUB_ENV

      - name: Set TAG from pushed tag or package.json
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF/refs\/tags\//}"
          else
            FRONTEND_VERSION=$(jq -r '.version' frontend/package.json)
            BACKEND_VERSION=$(jq -r '.version' backend/package.json)
            if [ "$FRONTEND_VERSION" != "$BACKEND_VERSION" ]; then
              echo "Error: Frontend version ($FRONTEND_VERSION) and backend version ($BACKEND_VERSION) do not match"
              exit 1
            fi
            TAG="v${FRONTEND_VERSION}-${SHORT_SHA}"
          fi
          echo "TAG=${TAG}" >> $GITHUB_ENV

      - name: Show set environment variables
        run: |
          printf "      TAG: %s\n"  "$TAG"
          printf " SHORT_SHA: %s\n" "$SHORT_SHA"

      # sh -e fails this step when a GeoIP download gives up: without it, the
      # image would get an empty or partial database and the step would still pass
      - name: Init repo for Dockerization
        run: sh -e docker/init.sh "$TAG"
        env:
          WGETRC: ${{ github.workspace }}/.github/wgetrc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build frontend image locally
        run: |
          docker buildx build \
            --tag test-frontend:$TAG \
            --build-arg commitHash=$SHORT_SHA \
            --load \
            --platform linux/amd64 \
            ./frontend/

      - name: Build backend image locally
        run: |
          docker buildx build \
            --tag test-backend:$TAG \
            --build-context rustgbt=./rust \
            --build-context backend=./backend \
            --build-arg commitHash=$SHORT_SHA \
            --load \
            --platform linux/amd64 \
            ./backend/

      # docker/docker-compose.yml selects its images through these variables,
      # so the test stack exercises the same path operators use.
      - name: Point docker-compose at the locally built images
        run: |
          echo "QBIT_EXPLORER_FRONTEND_IMAGE=test-frontend:${TAG}" >> "$GITHUB_ENV"
          echo "QBIT_EXPLORER_BACKEND_IMAGE=test-backend:${TAG}" >> "$GITHUB_ENV"

      - name: Prepare docker-compose test file
        run: |
          cat > /tmp/modify_compose.py << 'SCRIPT_END'
          import re
          import sys

          # Fail instead of silently testing a different setup when an edit
          # no longer matches docker-compose.yml.
          def require(applied, edit):
              if not applied:
                  sys.exit(f"docker/docker-compose.yml: could not {edit}. "
                           "Update this step to match the compose file.")

          def replace_once(content, old, new, edit):
              require(old in content, edit)
              return content.replace(old, new, 1)

          # Read the base docker-compose file
          with open('docker/docker-compose.yml', 'r') as f:
              content = f.read()

          # Change web port mapping from 80:8080 to 8080:8080
          content = replace_once(content, '- 80:8080', '- 8080:8080', 'change the web port mapping')

          # Remove volumes from api service
          content, count = re.subn(r'    volumes:\n      - \.\/data:\/backend\/cache\n', '', content)
          require(count, 'remove the api volumes')

          # For db service: remove user, add tmpfs after stop_grace_period
          # (healthcheck already exists in base file)
          lines = content.split('\n')
          in_db_service = False
          removed_user = added_tmpfs = False
          new_lines = []
          for line in lines:
              service = re.match(r'  ([\w.-]+):', line)
              if service:
                  # a service under services:
                  in_db_service = service.group(1) == 'db'
              elif line.strip() and not line.startswith(' ') and not line.startswith('\t'):
                  in_db_service = False
              if in_db_service and line.strip() == 'user: "1000:1000"':
                  removed_user = True
                  continue
              new_lines.append(line)
              if in_db_service and line == '    stop_grace_period: 1m':
                  new_lines += ['    tmpfs:', '      - /var/lib/mysql']
                  added_tmpfs = True
          content = '\n'.join(new_lines)
          require(removed_user, 'remove the db user')
          require(added_tmpfs, 'add a tmpfs to the db service')

          # Remove volumes section from db service
          content, count = re.subn(r'    volumes:\n      - \.\/mysql\/data:\/var\/lib\/mysql\n', '', content)
          require(count, 'remove the db volumes')

          # Add depends_on to web service after ports
          web_ports = '    ports:\n      - 8080:8080'
          web_with_depends = '    ports:\n      - 8080:8080\n    depends_on:\n      - api\n      - db'
          content = replace_once(content, web_ports, web_with_depends, 'add depends_on to the web service')

          # Add depends_on to api service after command
          api_command = '    command: "./wait-for-it.sh db:3306 --timeout=720 --strict -- ./start.sh"'
          api_with_depends = '    command: "./wait-for-it.sh db:3306 --timeout=720 --strict -- ./start.sh"\n    depends_on:\n      - db'
          content = replace_once(content, api_command, api_with_depends, 'add depends_on to the api service')

          # Write the modified content
          with open('docker-compose.test.yml', 'w') as f:
              f.write(content)
          
          print("Generated docker-compose.test.yml")
          SCRIPT_END
          python3 /tmp/modify_compose.py
          cat docker-compose.test.yml

      - name: Start containers
        run: |
          docker compose -f docker-compose.test.yml up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for all services (web, api, db) to be healthy..."
          timeout=120
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            # Check health status for all services
            PS_OUTPUT=$(docker compose -f docker-compose.test.yml ps)
            HEALTHY_COUNT=$(echo "$PS_OUTPUT" | grep -c "(healthy)" || true)
            if [ "$HEALTHY_COUNT" -ge 3 ]; then
              echo "All services are healthy!"
              echo "$PS_OUTPUT"
              break
            fi
            echo "Waiting for services to be healthy... (${elapsed}s/${timeout}s)"
            echo "$PS_OUTPUT"
            sleep 2
            elapsed=$((elapsed + 2))
          done
          if [ $elapsed -ge $timeout ]; then
            echo "Services did not become healthy in time"
            docker compose -f docker-compose.test.yml ps
            docker compose -f docker-compose.test.yml logs
            exit 1
          fi

      - name: Verify containers are healthy
        run: |
          echo "Checking container health status..."
          PS_OUTPUT=$(docker compose -f docker-compose.test.yml ps)
          echo "$PS_OUTPUT"
          
          # Check that all three services (web, api, db) are healthy
          HEALTHY_COUNT=$(echo "$PS_OUTPUT" | grep -c "(healthy)" || true)
          if [ "$HEALTHY_COUNT" -lt 3 ]; then
            echo "Not all containers are healthy. Expected 3 healthy services, found $HEALTHY_COUNT"
            docker compose -f docker-compose.test.yml logs
            exit 1
          fi
          
          # Verify each service individually for better error messages
          if ! echo "$PS_OUTPUT" | grep -q "web.*(healthy)"; then
            echo "Web service is not healthy"
            docker compose -f docker-compose.test.yml logs web
            exit 1
          fi
          if ! echo "$PS_OUTPUT" | grep -q "api.*(healthy)"; then
            echo "API service is not healthy"
            docker compose -f docker-compose.test.yml logs api
            exit 1
          fi
          if ! echo "$PS_OUTPUT" | grep -q "db.*(healthy)"; then
            echo "Database service is not healthy"
            docker compose -f docker-compose.test.yml logs db
            exit 1
          fi
          
          echo "All containers are healthy!"

      # Skip when the job failed before the test compose file existed; compose
      # would only add a misleading second error.
      - name: Show container logs
        if: failure() && hashFiles('docker-compose.test.yml') != ''
        run: |
          docker compose -f docker-compose.test.yml logs

      - name: Clean up containers
        if: always() && hashFiles('docker-compose.test.yml') != ''
        run: |
          docker compose -f docker-compose.test.yml down -v

  build:
    needs: test-images
    # Run on tag pushes, or on pull requests labelled "docker-push" whose head
    # branch lives in this repository (after test-images passes). Fork pull
    # requests never receive the Docker Hub secrets, so they skip this job.
    if: |
      needs.test-images.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'docker-push')))
    strategy:
      matrix:
        service:
          - frontend
          - backend
    # A second publish of the same ref and service (another label on a
    # docker-push pull request, or a re-run) waits for the running build
    # instead of racing it to push the same tags. GitHub keeps only one pending
    # job per concurrency group, so a newer pending publish replaces an older
    # pending one. A running build is never cancelled.
    concurrency:
      group: docker-build-${{ github.ref }}-${{ matrix.service }}
      cancel-in-progress: false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 120
    name: Build and push to DockerHub
    env:
      # the commit this job builds, tags and caches: the pull request head
      # rather than its merge ref, or the pushed tag
      BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      tag: ${{ matrix.service == 'frontend' && (steps.set-tag-push.outputs.tag || steps.set-tag-pr.outputs.tag) || '' }}
    steps:
      # Fail with a clear message instead of a login error when the repository
      # has not been given the Docker Hub secrets. Only a boolean is exposed.
      - name: Check Docker Hub secrets are configured
        env:
          DOCKER_SECRETS_CONFIGURED: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' && secrets.DOCKER_HUB_USER != '' }}
        run: |
          if [ "$DOCKER_SECRETS_CONFIGURED" != "true" ]; then
            echo "::error::Set the DOCKER_USERNAME, DOCKER_PASSWORD and DOCKER_HUB_USER Actions secrets before publishing images."
            exit 1
          fi

      - name: Replace the current swap file
        shell: bash
        run: |
          sudo swapoff /mnt/swapfile || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Show current memory and swap status
        shell: bash
        run: |
          sudo free -h
          echo
          sudo swapon --show

      - name: Mount a tmpfs over /var/lib/docker
        shell: bash
        run: |
          if [ ! -d "/var/lib/docker" ]; then
            echo "Directory '/var/lib/docker' not found"
            exit 1
          fi
          sudo mount -t tmpfs -o size=12G tmpfs /var/lib/docker
          sudo systemctl restart docker
          sudo df -h | grep docker

      # Only for tag pushes: use the Git tag as TAG
      - name: Set TAG from pushed tag
        if: github.event_name == 'push'
        id: set-tag-push
        run: |
          TAG="${GITHUB_REF/refs\/tags\//}"
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Add SHORT_SHA env property with commit short sha
        run: echo "SHORT_SHA=${BUILD_SHA:0:8}" >> $GITHUB_ENV


      - name: Login to Docker for building
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
          persist-credentials: false

      # For PRs: use package.json version + short sha as TAG
      - name: Set TAG from service package.json for pull requests
        if: github.event_name == 'pull_request'
        id: set-tag-pr
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            VERSION=$(jq -r '.version' frontend/package.json)
          else
            VERSION=$(jq -r '.version' backend/package.json)
          fi
          TAG="v${VERSION}-${SHORT_SHA}"
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Show set environment variables
        run: |
          printf "      TAG: %s\n"  "$TAG"
          printf " SHORT_SHA: %s\n" "$SHORT_SHA"

      # sh -e as in test-images
      - name: Init repo for Dockerization
        run: sh -e docker/init.sh "$TAG"
        env:
          WGETRC: ${{ github.workspace }}/.github/wgetrc

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: linux/amd64,linux/arm64
        id: qemu

      - name: Setup Docker buildx action
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          platforms: linux/amd64,linux/arm64
          driver-opts: |
            network=host
        id: buildx

      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      - name: Cache Docker layers
        uses: actions/cache@v4
        id: cache
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.service }}-${{ env.BUILD_SHA }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.service }}-

      - name: Run Docker buildx for ${{ matrix.service }} against tag
        id: docker-build
        run: |
          docker buildx build \
          --cache-from "type=local,src=/tmp/.buildx-cache" \
          --cache-to "type=local,dest=/tmp/.buildx-cache,mode=max" \
          --platform linux/amd64,linux/arm64 \
          --tag ${{ secrets.DOCKER_HUB_USER }}/${{ matrix.service }}:$TAG \
          --build-context rustgbt=./rust \
          --build-context backend=./backend \
          --output "type=registry,push=true" \
          --build-arg commitHash=$SHORT_SHA \
          ./${{ matrix.service }}/

  tag-latest:
    needs: build
    # Only for successful tag pushes (not PRs with docker-push label) and only for "plain" versions (no '-')
    if: ${{ needs.build.result == 'success' && github.event_name == 'push' && !contains(github.ref_name, '-') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    name: Tag release build as latest
    strategy:
      matrix:
        service:
          - frontend
          - backend
    # `latest` is shared by every release, so an update for a service waits for
    # the running one instead of racing it. GitHub keeps only one pending job
    # per concurrency group, so a newer pending update replaces an older
    # pending one. A running update is never cancelled.
    concurrency:
      group: docker-tag-latest-${{ matrix.service }}
      cancel-in-progress: false
    steps:
      - name: Set env variables
        run: echo "TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Setup Docker buildx action
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          platforms: linux/amd64,linux/arm64
          driver-opts: |
            network=host

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag as latest for ${{ matrix.service }}
        run: |
          docker buildx imagetools create \
            --tag ${{ secrets.DOCKER_HUB_USER }}/${{ matrix.service }}:latest \
            ${{ secrets.DOCKER_HUB_USER }}/${{ matrix.service }}:$TAG

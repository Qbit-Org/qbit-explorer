name: qbit Regtest Smoke

on:
  pull_request:
    # No review_requested, unlike ci.yml: requesting a reviewer would cancel
    # and restart this long job for the same commit.
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

# Read-only token; the job needs no secrets, so fork pull requests run it too.
permissions:
  contents: read

# A newer run for the same pull request cancels the older one. Every push to
# main gets a run of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Qbit-Org/qbit v1.0.0 release binaries. The checksum is this tarball's
  # entry in the release's SHA256SUMS.
  QBIT_VERSION: "1.0.0"
  QBIT_TARBALL_SHA256: ae121af03263b55d530e3f3e8719a71362d0950cba82f54a2bc2d6c437a029b5
  # Qbit-Org/qbit-electrs main: the indexer contract commit AGENTS.md cites.
  QBIT_ELECTRS_SHA: 53102e925713211ebf9ee8fe34b2f68534740fd9

jobs:
  regtest-smoke:
    if: "(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ops') && !contains(github.head_ref, 'ops/')) || github.event_name == 'push'"
    name: qbit regtest smoke (qbitd, qbit-electrs, MariaDB)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # A cold qbit-electrs build takes most of an hour; a cached one takes minutes.
    # The rest leaves room for the stack, the smoke checks and the browser tests.
    timeout-minutes: 90

    services:
      # The image the backend integration tests use (backend/docker-compose.test.yml)
      mariadb:
        image: mariadb:10.5.21
        env:
          MYSQL_DATABASE: qbit_regtest_harness
          MYSQL_USER: qbit_regtest_harness
          MYSQL_PASSWORD: qbit_regtest_harness
          MYSQL_ROOT_PASSWORD: admin
        # A random host port on 127.0.0.1: on a fixed 33306 this service
        # collided with backend-integration.yml's database when both ran at once.
        ports:
          - 127.0.0.1::3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u qbit_regtest_harness -pqbit_regtest_harness"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      QBIT_REGTEST_DIR: ${{ github.workspace }}/qbit-regtest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: qbit-explorer
          persist-credentials: false

      - name: Checkout qbit-electrs
        uses: actions/checkout@v4
        with:
          repository: Qbit-Org/qbit-electrs
          ref: ${{ env.QBIT_ELECTRS_SHA }}
          path: qbit-electrs
          persist-credentials: false

      # glibc goes into the qbit-electrs binary cache key, so a runner image
      # update can't restore a binary built against other system libraries.
      - name: Read rust-toolchain files
        id: gettoolchain
        run: |
          gbt="$(sh qbit-explorer/rust/gbt/scripts/toolchain-channel.sh)"
          {
            echo "gbt=$gbt"
            echo "electrs=$(cat qbit-electrs/rust-toolchain)"
            echo "glibc=$(ldd --version | head -n 1 | awk '{print $NF}')"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26.12.1"
          registry-url: "https://registry.npmjs.org"
          cache: 'npm'
          cache-dependency-path: |
            qbit-explorer/backend/package-lock.json
            qbit-explorer/frontend/package-lock.json

      - name: Install npm 11.12.0
        run: npm install -g npm@11.12.0

      # One cache holds the crates both Rust builds download; the caches below
      # hold only each build's target directory.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-regtest-${{ hashFiles('qbit-explorer/rust/gbt/**/Cargo.lock', 'qbit-electrs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-regtest-

      - name: Cache rust/gbt build
        uses: actions/cache@v4
        with:
          path: qbit-explorer/rust/gbt/target/
          # Exact key only, so old artifacts don't pile up in the cache.
          key: ${{ runner.os }}-gbt-target-${{ steps.gettoolchain.outputs.gbt }}-${{ hashFiles('qbit-explorer/rust/gbt/**/Cargo.lock') }}

      - name: Install ${{ steps.gettoolchain.outputs.gbt }} Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.gettoolchain.outputs.gbt }}

      - name: Install backend dependencies
        run: npm ci
        working-directory: qbit-explorer/backend

      - name: Build backend
        run: npm run build
        working-directory: qbit-explorer/backend

      - name: Download and verify qbit ${{ env.QBIT_VERSION }}
        run: |
          tarball="qbit-${QBIT_VERSION}-x86_64-linux-gnu.tar.gz"
          mkdir -p "$RUNNER_TEMP/qbit"
          cd "$RUNNER_TEMP/qbit"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 \
            --output "$tarball" \
            "https://github.com/Qbit-Org/qbit/releases/download/v${QBIT_VERSION}/${tarball}"
          echo "${QBIT_TARBALL_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball"
          bin="$RUNNER_TEMP/qbit/qbit-${QBIT_VERSION}/bin"
          "$bin/qbitd" -version
          echo "QBITD=$bin/qbitd" >> "$GITHUB_ENV"
          echo "QBIT_CLI=$bin/qbit-cli" >> "$GITHUB_ENV"

      # Cache only the built binary, keyed on the exact commit and toolchain. A
      # hit skips the build dependencies, the toolchain and the build; a miss
      # builds from scratch and saves right away, even if a later step fails.
      - name: Restore qbit-electrs binary
        id: electrs-cache
        uses: actions/cache/restore@v4
        with:
          path: qbit-electrs/target/release/electrs
          key: ${{ runner.os }}-glibc${{ steps.gettoolchain.outputs.glibc }}-qbit-electrs-bin-${{ steps.gettoolchain.outputs.electrs }}-${{ env.QBIT_ELECTRS_SHA }}

      # qbit-electrs's README and Dockerfile: clang and cmake build RocksDB.
      - name: Install qbit-electrs build dependencies
        if: steps.electrs-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake

      - name: Install ${{ steps.gettoolchain.outputs.electrs }} Rust toolchain for qbit-electrs
        if: steps.electrs-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.gettoolchain.outputs.electrs }}

      - name: Build qbit-electrs
        if: steps.electrs-cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked --bin electrs
        working-directory: qbit-electrs

      - name: Save qbit-electrs binary
        if: steps.electrs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: qbit-electrs/target/release/electrs
          key: ${{ steps.electrs-cache.outputs.cache-primary-key }}

      - name: Start the regtest stack
        timeout-minutes: 15
        run: backend/scripts/qbit-regtest-harness.sh up
        working-directory: qbit-explorer
        env:
          QBIT_ELECTRS: ${{ github.workspace }}/qbit-electrs/target/release/electrs
          QBIT_REGTEST_DB_HOST: 127.0.0.1
          QBIT_REGTEST_DB_PORT: ${{ job.services.mariadb.ports['3306'] }}
          QBIT_REGTEST_DB_NAME: qbit_regtest_harness
          QBIT_REGTEST_DB_USER: qbit_regtest_harness
          QBIT_REGTEST_DB_PASSWORD: qbit_regtest_harness

      - name: Run qbit regtest smoke checks
        id: smoke
        timeout-minutes: 5
        run: |
          set -a
          . "$QBIT_REGTEST_DIR/smoke.env"
          set +a
          npm run smoke:qbit-regtest
        working-directory: qbit-explorer/backend

      - name: Cache the Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('qbit-explorer/frontend/package-lock.json') }}

      # What Cypress's docs list for Ubuntu 24.04
      - name: Install browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libgbm1 libnotify4 libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb

      - name: Install frontend dependencies
        run: npm ci
        working-directory: qbit-explorer/frontend

      - name: Run browser tests
        timeout-minutes: 20
        run: |
          set -a
          . "$QBIT_REGTEST_DIR/smoke.env"
          set +a
          npm run cypress:run:regtest
        working-directory: qbit-explorer/frontend

      # On any failure: a failed `up` also prints shorter tails, but one cut off
      # by the step timeout may not.
      - name: Show regtest log tails
        if: failure()
        run: |
          for log in "$QBIT_REGTEST_DIR"/logs/*.log; do
            [ -f "$log" ] || continue
            echo "::group::$(basename "$log")"
            tail -n 200 "$log"
            echo "::endgroup::"
          done

      - name: Upload regtest logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qbit-regtest-logs
          path: ${{ env.QBIT_REGTEST_DIR }}/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload browser test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qbit-regtest-screenshots
          path: qbit-explorer/frontend/cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      # Skip when the job failed before the checkout; the harness exits
      # cleanly when it has nothing to stop.
      - name: Stop the regtest stack
        if: always() && hashFiles('qbit-explorer/backend/scripts/qbit-regtest-harness.sh') != ''
        run: backend/scripts/qbit-regtest-harness.sh down
        working-directory: qbit-explorer

	access_log /var/log/nginx/access_mempool.log;
	error_log /var/log/nginx/error_mempool.log;
# BEGIN QBIT MANAGED DOCKER DNS
	resolver 127.0.0.11 valid=10s ipv6=off;
	set $mempool_backend "127.0.0.1:8999";
# END QBIT MANAGED DOCKER DNS
	# The API and WebSocket locations below proxy to $mempool_backend. The
	# Docker image writes BACKEND_MAINNET_HTTP_HOST and _PORT into it. nginx
	# looks a host name, such as Compose's "api", up when a request comes in,
	# and keeps the answer for 10 seconds, so it follows a recreated container
	# to its new address. 127.0.0.11 is Docker's DNS server on a user-defined
	# network; the image's entrypoint sets the resolver line from the
	# container's /etc/resolv.conf at every start. An IP address, as on a
	# bare-metal host, needs no lookup, and nginx doesn't use the resolver for
	# it. Keep the BEGIN and END lines, which the production image build looks
	# for.

	root /var/www/mempool/browser;

	index index.html;

	# Keep redirects proxy-safe instead of exposing nginx's container port.
	absolute_redirect off;

	# enable browser and proxy caching
	add_header Cache-Control "public, no-transform";

	# vary cache if user changes language preference
	add_header Vary Accept-Language;
	add_header Vary Cookie;

	# fallback for all URLs i.e. /address/foo /tx/foo /block/000
	location = / {
		if (-f $document_root$localized_route_prefix/index.html) {
			return 302 $localized_route_prefix/$is_args$args;
		}
		try_files /en-US/index.html =404;
		expires 10m;
	}
	location / {
		try_files /$lang/$uri /$lang/$uri/ $uri $uri/ /en-US/$uri @index-redirect;
		expires 10m;
	}
	location /resources {
		try_files $uri @index-redirect;
		expires 1h;
	}

	# only cache /resources/config.* for 5 minutes since it changes often
	location /resources/config. {
		try_files $uri =404;
		expires 5m;
	}
	# only cache /resources/customize.* for 5 minutes since it changes often
	location /resources/customize. {
		try_files $uri =404;
		expires 5m;
	}

	# same-origin passthrough to the qbit.org design contract so the frontend
	# can refresh nav/tokens at runtime without CORS. The variable upstream
	# defers DNS to request time (per-request resolver), so an offline or
	# DNS-isolated deployment still boots nginx and serves the vendored
	# fallback; only this optional refresh request fails.
	location /qbit-design/ {
		resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
		resolver_timeout 5s;
		set $qbit_design_upstream https://qbit.org;
		rewrite ^/qbit-design/(.*)$ /design/$1 break;
		proxy_pass $qbit_design_upstream;
		proxy_ssl_server_name on;
		proxy_ssl_name qbit.org;
		proxy_ssl_verify on;
		proxy_ssl_verify_depth 2;
		proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
		proxy_set_header Host qbit.org;
		# never forward deployment credentials to the external host
		proxy_set_header Cookie "";
		proxy_set_header Authorization "";
	}

	location @index-redirect {
		if (-f $document_root$localized_route_prefix/index.html) {
			return 302 $localized_route_prefix$uri$is_args$args;
		}
		try_files /en-US/index.html =404;
	}

	# location block using regex are matched in order

	# Canonicalize bare locale paths, including locales without a built index.
	location ~ ^/(ar|bg|bs|ca|cs|da|de|et|el|es|eo|eu|fa|fr|gl|ko|hr|id|it|he|ka|lv|lt|hu|mk|ms|nl|ja|nb|ne|nn|pl|pt|pt-BR|ro|ru|sk|sl|sr|sh|fi|sv|th|tr|uk|vi|zh|hi)$ {
		if (-f $document_root/$1/index.html) {
			return 302 /$1/$is_args$args;
		}
		return 302 /$is_args$args;
	}

	# used for cookie override
	location ~ ^/(?<requested_locale>ar|bg|bs|ca|cs|da|de|et|el|es|eo|eu|fa|fr|gl|ko|hr|id|it|he|ka|lv|lt|hu|mk|ms|nl|ja|nb|ne|nn|pl|pt|pt-BR|ro|ru|sk|sl|sr|sh|fi|sv|th|tr|uk|vi|zh|hi)(?<locale_path>/.*)$ {
		# The en-US build uses base href "/", so strip an unavailable locale
		# prefix before falling back to keep Angular deep links routable.
		if (!-f $document_root/$requested_locale/index.html) {
			return 302 $locale_path$is_args$args;
		}
		try_files $uri $uri/ /$requested_locale/index.html =404;
	}

	# static API docs
	location = /api {
		try_files $uri $uri/ /en-US/index.html =404;
	}
	location = /api/ {
		try_files $uri $uri/ /en-US/index.html =404;
	}

	# proxy_pass with a variable passes the request path on unchanged, so the
	# locations that map a prefix to another path rewrite it first.
	location /api/v1/ws {
		rewrite ^/api/v1/ws(.*)$ /$1 break;
		proxy_pass http://$mempool_backend;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
	}
	location /api/v1/services {
		return 404;
	}
	location /api/v1 {
		proxy_pass http://$mempool_backend;
	}
	location /api/ {
		rewrite ^/api/(.*)$ /api/v1/$1 break;
		proxy_pass http://$mempool_backend;
	}

	# mainnet API
	location /ws {
		rewrite ^/ws(.*)$ /$1 break;
		proxy_pass http://$mempool_backend;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
	}

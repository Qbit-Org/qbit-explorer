<ng-container *ngIf="rateUnits$ | async as units">
  <ng-container *ngIf="fee !== undefined; else noFee">
    <ng-container *ngIf="units !== 'wu'">{{ getFeeRate() | feeRounding:rounding:dp }} <span *ngIf="showUnit" [class]="unitClass" [style]="unitStyle" i18n="shared.sat-vbyte|bits/vB">bits/vB</span></ng-container>
    <ng-container *ngIf="units === 'wu'">{{ getFeeRatePerWeightUnit() | feeRounding:rounding:dp }} <span *ngIf="showUnit" [class]="unitClass" [style]="unitStyle" i18n="shared.sat-weight-units|bits/WU">bits/WU</span></ng-container>
  </ng-container>
  <ng-template #noFee>
      <ng-container *ngIf="units !== 'wu'">- <span *ngIf="showUnit" [class]="unitClass" [style]="unitStyle" i18n="shared.sat-vbyte|bits/vB">bits/vB</span></ng-container>
      <ng-container *ngIf="units === 'wu'">- <span *ngIf="showUnit" [class]="unitClass" [style]="unitStyle" i18n="shared.sat-weight-units|bits/WU">bits/WU</span></ng-container>
  </ng-template>
</ng-container>

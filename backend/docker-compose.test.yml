version: "3.7"

services:
  db-test:
    image: mariadb:10.5.21
    environment:
      MYSQL_DATABASE: "mempool_test"
      MYSQL_USER: "mempool_test"
      MYSQL_PASSWORD: "mempool_test"
      MYSQL_ROOT_PASSWORD: "admin"
      MARIADB_AUTO_UPGRADE: "1"
    ports:
      - "127.0.0.1:${MEMPOOL_TEST_DB_HOST_PORT:-33306}:3306"
      # Host port 33306 unless MEMPOOL_TEST_DB_HOST_PORT is set. CI sets it to
      # 0, so Docker picks a free port; jest.integration.setup.ts and the
      # backend-integration workflow read it back with "docker compose port".
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mempool_test", "-pmempool_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/mysql

